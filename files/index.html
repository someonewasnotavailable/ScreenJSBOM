<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tank">
    <div class="dropleft">
        <div class="screen">
            <p>Screen Dashboard</p>
        </div>
        <button class="sizeMenu dlb">
            <!-- dlb is dropleft button btw -->
            Screen Size
        </button>
        <button class="bitsMenu dlb">
            Bits
        </button>
        <button class="pageMenu dlb">
            Page Size
        </button>
        <button class="betaMenu dlb">
            Beta Features
        </button>
    </div>
    <div class="size dlc">
        <!-- dlc is dropleft content btw -->
        <p class="width">Width: NA</p>
        <p class="height">Height: NA</p>
        <p class="availHeight">Available Height: NA</p>
        <p class="availWidth">Available Width: NA</p>
    </div>
    <div class="Depth dlc">
        <p class="cDepth">Color Depth: NA</p>
        <p class="pDepth">Pixel Depth: NA</p>
    </div>
    <div class="browserSize dlc">
        <p class="innerw">InnerWidth: NA</p>
        <p class="innerh">InnerHeight: NA</p>
    </div>
    <button class="cr dlc">Create Window</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
